<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Generate Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
        }

        body {
            background: #0a0a0c;
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(212, 180, 131, 0.18) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 100%, rgba(168, 135, 82, 0.12) 0%, transparent 55%);
            font-family: Georgia, serif;
            color: #ECEAE5;
            display: flex;
            align-items: center;
            padding: 60px 80px;
            gap: 70px;
            position: relative;
        }

        /* Top gold accent line */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #D4B483, #C29F6E, #A88752);
        }

        /* Bottom URL watermark */
        body::after {
            content: 'prottaymojumder17.github.io/portfolio';
            position: absolute;
            bottom: 30px;
            right: 80px;
            font-family: 'Courier New', monospace;
            font-size: 15px;
            color: rgba(212, 180, 131, 0.55);
            letter-spacing: 2px;
        }

        .profile-circle {
            width: 380px;
            height: 380px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 3px solid transparent;
            background:
                linear-gradient(#0a0a0c, #0a0a0c) padding-box,
                linear-gradient(135deg, #D4B483, #A88752) border-box;
            padding: 10px;
            position: relative;
            box-shadow: 0 0 70px rgba(212, 180, 131, 0.35);
        }

        .profile-circle img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            display: block;
        }

        .profile-circle::before {
            content: '';
            position: absolute;
            inset: -18px;
            border-radius: 50%;
            border: 1px dashed rgba(212, 180, 131, 0.35);
        }

        .content {
            flex: 1;
            min-width: 0;
        }

        h1 {
            font-size: 64px;
            font-weight: 600;
            color: #ECEAE5;
            line-height: 1.05;
            letter-spacing: -2px;
            margin-bottom: 14px;
        }

        h2 {
            font-size: 20px;
            font-weight: 400;
            color: #D4B483;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-family: Arial, sans-serif;
            margin-bottom: 28px;
        }

        .accent-line {
            width: 70px;
            height: 3px;
            background: linear-gradient(90deg, #D4B483, #A88752);
            border-radius: 2px;
            margin-bottom: 26px;
        }

        p {
            font-size: 17px;
            color: #A8A6A1;
            line-height: 1.6;
            font-family: Arial, sans-serif;
            max-width: 560px;
        }
    </style>
</head>

<body>
    <div class="profile-circle">
        <img src="img/main.jpg" alt="Profile">
    </div>
    <div class="content">
        <h1>Prottay Mojumder</h1>
        <h2>AI/ML Researcher</h2>
        <div class="accent-line"></div>
        <p>Aspiring AI/ML Researcher focused on Deep Learning, Reinforcement Learning, and Scientific Machine Learning.
            Seeking PhD opportunities.</p>
    </div>
</body>

</html>
