<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Page Not Found — Prottay Mojumder</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Space+Grotesk:wght@700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0c;
            color: #ECEAE5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background-image:
                radial-gradient(circle at 30% 30%, rgba(212, 180, 131, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(168, 135, 82, 0.08) 0%, transparent 40%);
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(5rem, 15vw, 10rem);
            background: linear-gradient(135deg, #D4B483, #C29F6E, #A88752);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ECEAE5;
        }

        p {
            color: #A8A6A1;
            margin-bottom: 2rem;
            max-width: 500px;
            line-height: 1.7;
        }

        a {
            display: inline-block;
            padding: 0.9rem 2rem;
            background: linear-gradient(135deg, #D4B483, #C29F6E, #A88752);
            color: #0a0a0c;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(212, 180, 131, 0.3);
        }

        a:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 0 50px rgba(212, 180, 131, 0.6);
        }
    </style>
</head>

<body>
    <div>
        <h1>404</h1>
        <h2>Looks like you're lost</h2>
        <p>The page you're looking for doesn't exist. But don't worry — my portfolio is just one click away.</p>
        <a href="/">← Back to Portfolio</a>
    </div>
</body>

</html>
